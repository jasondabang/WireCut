<!doctype html>
<html><head><meta name=viewport content="width=device-width,initial-scale=1"><title>WireCut</title><link rel=stylesheet href=style.css></head>
<body>
<header><div id=clock>00:00</div><button>⋮</button></header>
<div class=grid>
<div class=card data-key=started>Started<h1 id=started>0.00</h1></div>
<div class=card data-key=added>Added<h1 id=added>0.00</h1></div>
