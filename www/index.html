<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WireCut</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div id="clock">00:00</div><button>⋮</button></header>
<section class="cards">
<div>Started<br><b id="started">0.00</b></div>
<div>Added<br><b id="added">0.00</b></div>
<div>Cut<br><b id="cut">0.00</b></div>
<div>Used<br><b id="used">0.00</b></div>
</section>
<section class="current">Current Length (m)<h1 id="current">0.00</h1></section>
<div class="nav"><button>‹ Prev Cut</button><button>Next Cut ›</button></div>
<div class="keys">
<button>7</button><button>8</button><button>9</button>
<button>4</button><button>5</button><button>6</button>
<button>1</button><button>2</button><button>3</button>
<button>0</button><button id="equal">=</button>
</div>
<select>
<option>0. = Calculate</option>
<option>1. Addition</option>
<option>2. Subtraction</option>
<option>3. Multiplication</option>
<option>4. Division</option>
</select>
<script src="database.js"></script>
<script src="backup.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
