<!doctype html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WireCut</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div class="app">
<header><div id="clock">00:00</div><button id="menu">⋮</button></header>

<div class="cards">
<div class="card" data-key="started">Started<h2 id="started">0.00</h2></div>
<div class="card" data-key="added">Added<h2 id="added">0.00</h2></div>
<div class="card" data-key="cut">Cut<h2 id="cut">0.00</h2></div>
<div class="card"><h2>Used</h2><h2 id="used">0.00</h2></div>
</div>

<section class="current">Current Length<br><strong id="length">0.00</strong> m</section>

<div class="actions">
<button class="prev">← Prev Cut</button>
<button class="next">Next Cut →</button>
</div>

<div class="keypad">
<button>7</button><button>8</button><button>9</button>
<button>4</button><button>5</button><button>6</button>
<button>1</button><button>2</button><button>3</button>
<button>.</button><button>0</button><button class="eq">=</button>
</div>

<div>
<button id="export">Export CSV</button>
<input id="import" type="file" accept=".csv">
</div>
</div>
<script src="app.js"></script>
<script>navigator.serviceWorker?.register("sw.js")</script>
</body></html>
