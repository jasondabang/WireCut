name: Build WireCut App

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build WireCut
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync

      - name: Upload WireCut artifact
        uses: actions/upload-artifact@v5
        with:
          name: WireCut-build
          path: |
            .
          if-no-files-found: error
