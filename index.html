<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cord Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div id="clock">00:00</div>
<button id="menu">⋮</button>
</header>

<div id="menuBox" class="hide">
<input id="username" placeholder="Username">
<button id="create">Create Username</button>
<button id="sync">Sync</button>
<button id="export">Export Backup</button>
<input type="file" id="import">
</div>

<div class="cards">
<div>Started<br><b id="started">0.00</b> m</div>
<div>Added<br><b id="added">0.00</b> m</div>
<div>Cut<br><b id="cut">0.00</b> m</div>
<div>Used<br><b id="used">0.00</b> m</div>
</div>

<section class="current">
Current Length (m)
<h1 id="current">0.00</h1>
</section>

<div class="nav">
<button>‹ Prev Cut</button>
<button>Next Cut ›</button>
</div>

<input id="display" readonly>

<div class="keys">
<button>7</button><button>8</button><button>9</button>
<button>4</button><button>5</button><button>6</button>
<button>1</button><button>2</button><button>3</button>
<button class="zero">0</button><button id="equal">=</button>
</div>

<select id="operation">
<option>0. = Calculate</option>
<option>1. Addition</option>
<option>2. Subtraction</option>
<option>3. Multiplication</option>
<option>4. Division</option>
</select>

<script src="app.js"></script>
</body>
</html>
